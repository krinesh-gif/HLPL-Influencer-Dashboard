<title>Reel to Doorstep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#FBF8F9; --surface:#FFFFFF; --surface-2:#F5F0F3; --surface-3:#EFE8EC;
  --ink:#1B1420; --ink-2:#57495A; --ink-3:#8A7C8B;
  --line:#E6DDE2; --line-strong:#D2C5CC;
  --rose:#C8326B; --rose-ink:#8E1F49; --rose-soft:#FBEAF1;
  --teal:#0095A6; --teal-ink:#046C79; --teal-soft:#E1F4F7;
  --good:#177245; --good-soft:#E4F3EA;
  --warn:#A65D00; --warn-soft:#FBEEDC;
  --crit:#B42318; --crit-soft:#FCEAE8;
  --c1:#C8326B; --c2:#B0790C; --c3:#0095A6; --c4:#6247D6;
  --shadow-sm:0 1px 2px rgba(27,20,32,.06);
  --shadow-md:0 2px 4px rgba(27,20,32,.05),0 12px 28px -14px rgba(27,20,32,.28);
  --radius:10px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Archivo","IBM Plex Sans",-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141017; --surface:#1D1720; --surface-2:#251E29; --surface-3:#2E2533;
    --ink:#F3ECEF; --ink-2:#BCACB8; --ink-3:#8B7C89;
    --line:#332A37; --line-strong:#483B4C;
    --rose:#E8628F; --rose-ink:#F5A3BE; --rose-soft:#381A27;
    --teal:#2BAFBD; --teal-ink:#7FD6DF; --teal-soft:#0C2E34;
    --good:#4FCB86; --good-soft:#122F20;
    --warn:#E0A340; --warn-soft:#33240D;
    --crit:#F07167; --crit-soft:#38181B;
    --c1:#DB4E7F; --c2:#BC8110; --c3:#12A6B4; --c4:#8570E6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 2px 4px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#141017; --surface:#1D1720; --surface-2:#251E29; --surface-3:#2E2533;
  --ink:#F3ECEF; --ink-2:#BCACB8; --ink-3:#8B7C89;
  --line:#332A37; --line-strong:#483B4C;
  --rose:#E8628F; --rose-ink:#F5A3BE; --rose-soft:#381A27;
  --teal:#2BAFBD; --teal-ink:#7FD6DF; --teal-soft:#0C2E34;
  --good:#4FCB86; --good-soft:#122F20;
  --warn:#E0A340; --warn-soft:#33240D;
  --crit:#F07167; --crit-soft:#38181B;
  --c1:#DB4E7F; --c2:#BC8110; --c3:#12A6B4; --c4:#8570E6;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 4px rgba(0,0,0,.35),0 12px 28px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
a{color:var(--rose)}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
.topbar-in{max-width:1480px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.brand-mark{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.03em}
.brand-mark em{font-style:normal;color:var(--rose)}
.brand-sub{font-size:11px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.tab{font:inherit;font-weight:600;font-size:13px;color:var(--ink-2);background:none;border:0;padding:7px 13px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"].lane-m{background:var(--rose);color:#fff}
.tab[aria-selected="true"].lane-s{background:var(--teal);color:#fff}
.tab .cnt{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--surface-3);color:var(--ink-2);border-radius:5px;padding:1px 5px}
.tab[aria-selected="true"] .cnt{background:rgba(255,255,255,.22);color:#fff}
.conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.03em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.live{background:var(--good)}
.dot.local{background:var(--warn)}

.ribbon{background:var(--surface-2);border-bottom:1px solid var(--line)}
.ribbon-in{max-width:1480px;margin:0 auto;padding:8px 20px;display:flex;gap:8px;overflow-x:auto;align-items:center}
.pchip{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 8px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;font-family:inherit}
.pchip:hover{border-color:var(--line-strong)}
.pchip .n{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink)}
.pchip .sw{width:8px;height:8px;border-radius:2px;flex:none}
.pchip.alert{border-color:var(--crit);background:var(--crit-soft)}
.pchip.alert .n{color:var(--crit)}

main{max-width:1480px;margin:0 auto;padding:22px 20px 80px}
.view-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.view-head h1{font-size:23px;font-weight:700}
.view-head p{margin:3px 0 0;color:var(--ink-3);font-size:13px;max-width:62ch}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--rose);border-color:var(--rose);color:#fff}
.btn-p:hover{background:var(--rose);filter:brightness(1.08)}
.btn-s{background:var(--teal);border-color:var(--teal);color:#fff}
.btn-s:hover{background:var(--teal);filter:brightness(1.08)}
.btn-q{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 9px}
.btn-q:hover{background:var(--surface-2);color:var(--ink)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn-danger{color:var(--crit);border-color:var(--line-strong)}
.btn-danger:hover{background:var(--crit-soft)}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:7px 9px;width:100%}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
textarea{font-family:var(--mono);font-size:12px;line-height:1.6;resize:vertical}
select{cursor:pointer}
label.f{display:block}
label.f>span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
label.f.req>span::after{content:" *";color:var(--rose)}
.hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.err{font-size:11px;color:var(--crit);margin-top:4px;font-weight:600}
input.bad,select.bad{border-color:var(--crit)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input,.filters select{width:auto;min-width:150px}
.search{min-width:250px!important}

/* ---------- panels + tables ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.panel-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{font-size:14px;font-weight:700;letter-spacing:-.01em}
.panel-h .sub{font-size:12px;color:var(--ink-3)}
.panel-b{padding:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.nowrap{white-space:nowrap}
.t-title{font-weight:600;color:var(--ink)}
.t-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.linkish{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;border-bottom:1px dotted var(--line-strong)}
.linkish:hover{color:var(--rose);border-color:var(--rose)}
.empty{padding:46px 20px;text-align:center;color:var(--ink-3)}
.empty h4{font-size:15px;color:var(--ink);margin-bottom:6px}
.rowsel{width:34px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.neutral{background:var(--surface-3);color:var(--ink-2)}
.pill.info{background:var(--teal-soft);color:var(--teal-ink);border-color:var(--teal)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.rose{background:var(--rose-soft);color:var(--rose-ink);border-color:var(--rose)}
.pill.plain::before{display:none}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--surface-3);color:var(--ink-2)}
.tag.pr{background:var(--rose-soft);color:var(--rose-ink)}
.agebar{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.agebar i{display:block;height:100%;border-radius:2px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.kpi{background:var(--surface);padding:14px 16px}
.kpi .k{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.kpi .v{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi.accent .v{color:var(--rose)}
.kpi.supply .v{color:var(--teal)}

/* ---------- charts ---------- */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--sans)}
.tt{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:7px;box-shadow:var(--shadow-md);max-width:230px;line-height:1.45}
.tt b{font-family:var(--mono);font-weight:600}
.tt[hidden]{display:none!important}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,14,22,.5);z-index:60;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--paper);z-index:61;box-shadow:var(--shadow-md);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer-h{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px}
.drawer-h h2{font-size:17px;font-weight:700}
.drawer-h .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.drawer-b{padding:20px;overflow-y:auto;flex:1}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fs{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px;margin-bottom:14px}
.fs>h4{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.fs>h4::after{content:"";flex:1;height:1px;background:var(--line)}
.fs.lane-m>h4{color:var(--rose-ink)}
.fs.lane-s>h4{color:var(--teal-ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.span2{grid-column:1/-1}
.itemrow{display:grid;grid-template-columns:1fr 78px 34px;gap:8px;align-items:end;margin-bottom:8px}
.callout{border-left:3px solid var(--teal);background:var(--teal-soft);padding:10px 13px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.crit{border-color:var(--crit);background:var(--crit-soft)}
.callout b{color:var(--ink)}
.pickbox{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow-y:auto;background:var(--surface)}
.pickrow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;text-align:left;color:var(--ink)}
.pickrow:last-child{border-bottom:0}
.pickrow:hover{background:var(--rose-soft)}
.pickrow .who{flex:1;min-width:0}
.pickrow .who b{display:block;font-weight:600;font-size:13px}
.pickrow .who span{display:block;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:0;flex-wrap:wrap;margin-bottom:14px}
.step{flex:1;min-width:88px;padding:7px 10px;font-size:11px;font-weight:700;text-align:center;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line);border-right:0;letter-spacing:.02em}
.step:first-child{border-radius:8px 0 0 8px}
.step:last-child{border-right:1px solid var(--line);border-radius:0 8px 8px 0}
.step.on{background:var(--teal);border-color:var(--teal);color:#fff}
.step.done{background:var(--teal-soft);color:var(--teal-ink);border-color:var(--teal-soft)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);max-width:90vw;text-align:center}
.toast[hidden]{display:none!important}
.toast.bad{background:var(--crit);color:#fff}
.selbar{position:sticky;bottom:14px;z-index:30;margin:14px auto 0;max-width:820px;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow-md)}
.selbar .n{font-family:var(--mono);font-weight:600}
.selbar .btn{background:transparent;border-color:rgba(255,255,255,.28);color:var(--paper)}
.selbar .btn:hover{background:rgba(255,255,255,.14)}
.selbar .btn-s{background:var(--teal);border-color:var(--teal);color:#fff}
.mapgrid{display:grid;grid-template-columns:1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:7px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:720px){
  .topbar-in{gap:10px}.tabs{margin-left:0;width:100%;overflow-x:auto}
  main{padding:16px 12px 70px}.itemrow{grid-template-columns:1fr 62px 32px}
}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark">Reel <em>&rarr;</em> Doorstep</span>
      <span class="brand-sub">Hivefy Lifestyle</span>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="conn" id="conn"><span class="dot"></span><span>Connecting</span></div>
  </div>
</div>
<div class="ribbon"><div class="ribbon-in" id="ribbon"></div></div>
<main id="view"></main>
<div class="tt" id="tt" hidden></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ============================================================
   Reel to Doorstep — influencer gifting + supply handoff console
   Storage: artifact `db` when available, localStorage otherwise.
   ============================================================ */
"use strict";

const STATES = ["Andaman and Nicobar Islands","Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chandigarh","Chhattisgarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Goa","Gujarat","Haryana","Himachal Pradesh","Jammu and Kashmir","Jharkhand","Karnataka","Kerala","Ladakh","Lakshadweep","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Puducherry","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal"];

const SHIP_FLOW = ["Draft","Ready to Ship","Order Created","Dispatched","Delivered"];
const SHIP_ALL  = [...SHIP_FLOW,"On Hold","Cancelled"];
const SHIP_TONE = {"Draft":"neutral","Ready to Ship":"warn","Order Created":"info","Dispatched":"rose","Delivered":"good","On Hold":"crit","Cancelled":"neutral"};
const PAY_STATES = ["Not Applicable (Barter)","Not Due","Due","Partially Paid","Paid"];
const PAY_TONE = {"Not Applicable (Barter)":"neutral","Not Due":"neutral","Due":"warn","Partially Paid":"warn","Paid":"good"};
const TIERS = ["Nano (<10K)","Micro (10K-100K)","Mid (100K-500K)","Macro (500K-1M)","Celebrity (1M+)"];
const PLATFORMS = ["Instagram","YouTube","Both"];
const DELIVERABLES = ["1 Reel","2 Reels","Reel + Story","Story only","YouTube Shorts","Static Post","Reel + Static","Custom"];
const BOXES = ["PR Box","Normal Box"];
const CATEGORIES = ["Beauty","Skincare","Haircare","Lifestyle","Fashion","Mom & Baby","Fitness","Comedy","Regional"];

/* --- UC bulk sale-order columns. Verify against YOUR Unicommerce template
       under Setup -> paste your header row to remap in one click. --- */
const UC_FIELDS = [
  ["order.code","Sale order code (auto: PR-YYMM-###)"],
  ["order.displayCode","Display order code (same as above)"],
  ["order.date","Order date/time"],
  ["order.channel","Channel code"],
  ["order.payment","Payment method (PREPAID/COD)"],
  ["order.paymentMode","Payment mode (PREPAID)"],
  ["order.cod","COD flag (1 = COD, 0 = prepaid)"],
  ["order.shipMethod","Shipping method code"],
  ["order.currency","Currency code (INR)"],
  ["cust.name","Customer name"],["cust.email","Customer email"],["cust.phone","Customer phone"],
  ["ship.name","Shipping name"],["ship.addr1","Shipping address line 1"],["ship.addr2","Shipping address line 2"],
  ["ship.city","Shipping city"],["ship.state","Shipping state"],["ship.country","Shipping country"],
  ["ship.pin","Shipping pincode"],["ship.phone","Shipping phone"],
  ["bill.name","Billing name"],["bill.addr1","Billing address line 1"],["bill.addr2","Billing address line 2"],
  ["bill.city","Billing city"],["bill.state","Billing state"],["bill.country","Billing country"],
  ["bill.pin","Billing pincode"],["bill.phone","Billing phone"],
  ["item.code","Sale order item code (order code + line no.)"],
  ["item.sku","Item SKU code"],["item.name","Item name"],
  ["item.qty","Item quantity"],["item.price","Item selling price"],
  ["item.discount","Item discount"],["item.ship","Item shipping charges"],["item.total","Item total (price-discount)"],
  ["facility.code","Facility code"],["notes","Notes / packing instruction"],["blank","(leave blank)"]
];
const UC_TEMPLATE_VERSION = 2;
const UC_DEFAULT_COLUMNS = [
  {header:"Sales Order Code*",field:"order.code"},
  {header:"Display Sales Order Code",field:"order.displayCode"},
  {header:"Notification Email",field:"cust.email"},
  {header:"Notification Mobile",field:"cust.phone"},
  {header:"COD*",field:"order.cod"},
  {header:"Channel",field:"order.channel"},
  {header:"Priority",field:"blank"},
  {header:"Shipping Address Id",field:"blank"},

  writeLocal(c,map){ try{ localStorage.setItem(this.key(c),JSON.stringify(map)); }catch(e){} },

  async init(){
    let db=null;
    try{ db = window.claude && claude.use ? await claude.use("db") : null; }catch(e){ db=null; }

        db.collection(c).onSnapshot(snap=>{

        }, e=>{ if(e.code==="revoked"||e.code==="unavailable") setConn("local","Offline — local only"); });
      }
      db.doc("config/settings").onSnapshot(snap=>{
        S.settings = {...DEFAULT_SETTINGS, ...(snap.exists?snap.data():{})};
        if(!Array.isArray(S.settings.ucColumns)||!S.settings.ucColumns.length) S.settings.ucColumns=UC_DEFAULT_COLUMNS;
        if(this.ready) render();
      }, ()=>{});
      // one prefetch so the first paint has data
      try{
        const got = await Promise.all(["influencers","collabs","skus"].map(c=>db.collection(c).limit(1000).get()));
        ["influencers","collabs","skus"].forEach((c,i)=>{ const m={};
          got[i].docs.forEach(d=>{ m[d.id]={id:d.id,...d.data()}; }); S[c]=m; });
        const cfg = await db.doc("config/settings").get();
        if(cfg.exists) S.settings={...DEFAULT_SETTINGS,...cfg.data()};
      }catch(e){}
    } else {
      for(const c of ["influencers","collabs","skus"]) S[c]=this.readLocal(c);
      const cfg=this.readLocal("settings"); if(cfg && cfg.channel) S.settings={...DEFAULT_SETTINGS,...cfg};

      S.settings.ucColumns=UC_DEFAULT_COLUMNS.map(c=>({...c}));

      catch(e){ toast(dbMsg(e),true); }
    } else this.writeLocal(coll,S[coll]);
    return obj.id;
  },
  async putMany(coll,list){
    for(const o of list) await this.put(coll,o);
  },
  async remove(coll,id){
    delete S[coll][id]; render();
    if(this.db){ try{ await this.db.collection(coll).doc(id).delete(); }catch(e){ toast(dbMsg(e),true); } }
    else this.writeLocal(coll,S[coll]);
  },
  async saveSettings(){
    render();
    if(this.db){ try{ await this.db.doc("config/settings").set({...S.settings}); }catch(e){ toast(dbMsg(e),true); } }
    else this.writeLocal("settings",S.settings);

const erOf = c=>{const b=num(c.reach)||num(c.views); return b?(engagements(c)/b*100):0;};
const cpvOf = c=>num(c.views)?num(c.price)/num(c.views):0;
const cpeOf = c=>engagements(c)?num(c.price)/engagements(c):0;
const outstanding = c=>c.barter?0:Math.max(0,num(c.price)-num(c.paid));

const shipTAT = c=>daysBetween(c.requestedAt,c.dispatchDate);
const pendingAge = c=>["Ready to Ship","Order Created"].includes(c.shipStatus)?daysSince(c.requestedAt):null;
const orderValue = c=>(c.items||[]).reduce((s,i)=>s+num(i.mrp)*num(i.qty),0);

function nextOrderCode(){
  const pfx = (S.settings.orderPrefix||"PR").toUpperCase();
  const stamp = new Date().toISOString().slice(2,7).replace("-","");
  const re = new RegExp("^"+pfx+"-"+stamp+"-(\\d+)$");
  let max=0;
  collabList().forEach(c=>{ const m=re.exec(c.ucCode||""); if(m) max=Math.max(max,+m[1]); });
  return n=>pfx+"-"+stamp+"-"+String(max+n).padStart(3,"0");
}

/* ================= Unicommerce bulk file ================= */
function ucValue(field,ctx){
  const {c,item,code,st,s,line} = ctx;
  if(String(field||"").startsWith("const:")) return String(field).slice(6);
  const gift = s.gifting;
  const price = gift ? num(item.mrp) : num(item.mrp);
  const disc  = gift ? num(item.mrp) : 0;

    "blank":""
  };
  return map[field] ?? "";
}
function csvCell(v){ const s=String(v??"");
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function buildUCFile(collabs){
  const s = S.settings, cols = s.ucColumns||UC_DEFAULT_COLUMNS;
  const gen = nextOrderCode();
  const rows = [cols.map(c=>csvCell(c.header)).join(",")];
  const assigned = [];
  collabs.forEach((c,i)=>{
    const code = c.ucCode || gen(assigned.filter(a=>!a.reused).length+1);
    assigned.push({collab:c,code,reused:!!c.ucCode});
    const st = c.ship||{};
    (c.items||[]).forEach((item,li)=>{
      rows.push(cols.map(col=>csvCell(ucValue(col.field,{c,item,code,st,s,line:li+1}))).join(","));
    });
  });
  return {csv:"﻿"+rows.join("\r\n")+"\r\n", assigned};
}

<script>
/* ================= charts ================= */
const SVGNS="http://www.w3.org/2000/svg";
const sv=(t,a={})=>{const n=document.createElementNS(SVGNS,t);for(const k in a)if(a[k]!==null&&a[k]!==undefined)n.setAttribute(k,a[k]);return n;};
function topRound(x,y,w,h,r){ r=Math.min(r,w/2,h); if(h<=0) return "";
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`; }
function rightRound(x,y,w,h,r){ r=Math.min(r,h/2,w); if(w<=0) return "";
  return `M${x},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x},${y+h} Z`; }
function tipOn(node,html){
  node.addEventListener("pointerenter",e=>{const t=$("#tt");t.innerHTML=html;t.hidden=false;moveTip(e);});
  node.addEventListener("pointermove",moveTip);
  node.addEventListener("pointerleave",()=>{$("#tt").hidden=true;});
}
function moveTip(e){const t=$("#tt");const pad=14;
  let x=e.clientX+pad,y=e.clientY+pad;
  const r=t.getBoundingClientRect();
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-pad;
  if(y+r.height>innerHeight-8)y=e.clientY-r.height-pad;
  t.style.left=x+"px";t.style.top=y+"px";}

function barsV(data,opt={}){ // data: [{label,value,tip}]
  const W=620,H=210,padL=6,padR=6,padT=24,padB=28;
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",role:"img","aria-label":opt.aria||""});
  const max=Math.max(1,...data.map(d=>d.value));
  const iw=W-padL-padR, ih=H-padT-padB;
  [0,.5,1].forEach(f=>svg.appendChild(sv("line",{x1:padL,x2:W-padR,y1:padT+ih*f,y2:padT+ih*f,
    stroke:"var(--line)","stroke-width":1})));
  const step=iw/Math.max(1,data.length), bw=Math.min(46,step*0.62);
  data.forEach((d,i)=>{
    const h=Math.round(ih*(d.value/max)), x=padL+step*i+(step-bw)/2, y=padT+ih-h;
    const g=sv("g",{});
    g.appendChild(sv("path",{d:topRound(x,y,bw,Math.max(h,d.value>0?2:0),4),fill:opt.color||"var(--c1)"}));
    if(d.value>0) g.appendChild(sv("text",{x:x+bw/2,y:y-7,"text-anchor":"middle","font-size":11,"font-weight":600,
      fill:"var(--ink-2)"})).textContent=opt.fmt?opt.fmt(d.value):String(d.value);
    const lab=sv("text",{x:x+bw/2,y:H-9,"text-anchor":"middle","font-size":11,fill:"var(--ink-3)"});
    lab.textContent=d.label; g.appendChild(lab);
    const hit=sv("rect",{x:padL+step*i,y:padT,width:step,height:ih,fill:"transparent"});
    g.appendChild(hit); tipOn(hit,d.tip||`${esc(d.label)} · <b>${opt.fmt?opt.fmt(d.value):d.value}</b>`);
    svg.appendChild(g);
  });
  return svg;
}
function barsH(data,opt={}){ // data:[{label,value,color,tip}]
  const rowH=34,W=620,padL=0,padR=6,labelW=150;
  const H=Math.max(60,data.length*rowH+8);
  const svg=sv("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",role:"img","aria-label":opt.aria||""});
  const max=Math.max(1,...data.map(d=>d.value));
  const track=W-labelW-padR-70;
  data.forEach((d,i)=>{
    const y=i*rowH+6, bh=16;
    const t=sv("text",{x:0,y:y+13,"font-size":12,fill:"var(--ink-2)","font-weight":600});
    t.textContent=d.label; svg.appendChild(t);
    svg.appendChild(sv("rect",{x:labelW,y,width:track,height:bh,rx:4,fill:"var(--surface-2)"}));
    const w=Math.round(track*(d.value/max));
    svg.appendChild(sv("path",{d:rightRound(labelW,y,Math.max(w,d.value>0?3:0),bh,4),fill:d.color||"var(--c1)"}));
    const v=sv("text",{x:labelW+track+8,y:y+13,"font-size":12,fill:"var(--ink)","font-weight":600});
    v.textContent=opt.fmt?opt.fmt(d.value):String(d.value); svg.appendChild(v);
    const hit=sv("rect",{x:0,y:y-4,width:W,height:rowH,fill:"transparent"});
    svg.appendChild(hit); tipOn(hit,d.tip||`${esc(d.label)} · <b>${opt.fmt?opt.fmt(d.value):d.value}</b>`);
  });
  return svg;
}

function downloadBlankTemplate(){
  const cols=S.settings.ucColumns||UC_DEFAULT_COLUMNS;
  saveFile("unicommerce-bulk-order-template.csv","﻿"+cols.map(c=>csvCell(c.header)).join(",")+"\r\n");
}
function openHeaderPaste(){
  let txt="";
  const guess=h=>{
    const k=h.toLowerCase().replace(/[^a-z0-9]/g,"");
    const has=(...w)=>w.every(x=>k.includes(x));
    if(has("saleorder","code")||k==="ordercode")return "order.code";
    if(has("display"))return "order.displayCode";
    if(has("order","date")||has("orderdatetime"))return "order.date";
    if(k==="channel"||has("channel","code"))return "order.channel";
    if(has("payment","method")||has("paymentmode"))return "order.payment";
    if(has("cash","delivery")||k==="cod")return "order.cod";
    if(has("customer","name"))return "cust.name";
    if(has("customer","email"))return "cust.email";
    if(has("customer","phone")||has("customer","mobile"))return "cust.phone";
    const side=k.startsWith("shipping")||k.startsWith("ship")?"ship":(k.startsWith("billing")||k.startsWith("bill")?"bill":null);
    if(side){
      if(has("line1")||has("address1")||(k.includes("address")&&!k.includes("2")&&!has("city")&&!has("state")&&!has("pin")&&!has("country")))return side+".addr1";
      if(has("line2")||has("address2"))return side+".addr2";
      if(has("city"))return side+".city";
      if(has("state"))return side+".state";
      if(has("country"))return side+".country";
      if(has("pin")||has("zip")||has("postal"))return side+".pin";
      if(has("phone")||has("mobile"))return side+".phone";
      if(has("name"))return side+".name";
    }
    if(has("sku"))return "item.sku";
    if(has("quantity")||k==="qty")return "item.qty";
    if(has("selling","price")||k==="price"||has("unitprice"))return "item.price";
    if(has("discount"))return "item.discount";
    if(has("shipping","charge"))return "item.ship";
    if(has("total"))return "item.total";
    if(has("facility"))return "facility.code";
    if(has("note")||has("remark")||has("instruction"))return "notes";
    return "blank";
  };
  drawer("Paste your Unicommerce header row",
    "Open your UC sale-order import template, copy row 1, paste it here.",
    api=>{
      api.body.appendChild(el("div",{class:"callout"},"Paste the header row exactly — commas or tabs both work. Your headers are kept verbatim so UC accepts the file; only the mapping is guessed."));
      api.body.appendChild(field("Header row",el("textarea",{rows:5,placeholder:"Sale Order Code,Display Order Code,Order Date,…",
        oninput:e=>{txt=e.target.value;}})));
    },
    api=>{
      api.foot.appendChild(el("button",{class:"btn btn-p",onclick:()=>{
        const raw=txt.trim(); if(!raw){toast("Paste the header row first",true);return;}
        const sep=raw.includes("\t")?"\t":",";
        const heads=raw.split(/\r?\n/)[0].split(sep).map(h=>h.trim().replace(/^"|"$/g,"")).filter(Boolean);
        if(heads.length<3){toast("That does not look like a header row",true);return;}
        S.settings.ucColumns=heads.map(h=>({header:h,field:guess(h)}));
        Store.saveSettings(); api.close();
        toast(heads.length+" columns mapped — check the ones marked (leave blank)");
      }},"Map these columns"));
      api.foot.appendChild(el("button",{class:"btn",onclick:api.close},"Cancel"));
    });
}
</script>
<script>

function shipFromInfluencer(i){
  return {name:i.name||"",phone:i.phone||"",email:i.email||"",addr1:i.addr1||"",addr2:i.addr2||"",
    city:i.city||"",state:i.state||"",pin:i.pin||""};
}
function repeatCollab(infId){
  const i=S.influencers[infId]; if(!i) return;
  const prev=collabList().filter(c=>c.influencerId===infId).sort((a,b)=>(b.requestedAt||"").localeCompare(a.requestedAt||""))[0];
  const d=blankCollab();
  d.influencerId=infId; d.ship=shipFromInfluencer(i); d.platform=i.platform||"Instagram";
  if(prev){ d.items=(prev.items||[]).map(x=>({...x})); d.box=prev.box; d.deliverable=prev.deliverable;
    d.payTerms=prev.payTerms; d.price=prev.price; }

    prev?"Address, products and terms carried over from "+dmy(prev.requestedAt):"Address carried over from the master");

function openCollab(id,focus){

function openCollabDraft(d,id,title,sub,focus){

        list.forEach(i=>results.appendChild(el("button",{class:"pickrow",onclick:()=>{

          el("span",{class:"pill neutral plain"},collabList().filter(c=>c.influencerId===i.id).length+"x"))));
      };
      draw();
      who.appendChild(field("Find a saved influencer",input("",v=>{q=v;draw();},{type:"search",placeholder:"Name, handle, mobile or city…"}),

    who.appendChild(el("div",{class:"grid2"},

      field("Instagram / YouTube handle",input((inf&&inf.handle)||d.handle||"",v=>{d.handle=cleanHandle(v);}),
        {hint:inf?"Editing this updates the master.":"Without @"}),
      field("Platform",select(d.platform,PLATFORMS,v=>{d.platform=v;})),
      field("Tier",select((inf&&inf.tier)||d.tier||TIERS[1],TIERS,v=>{d.tier=v;})),
      field("Category",select((inf&&inf.category)||d.category||CATEGORIES[0],CATEGORIES,v=>{d.category=v;}))));
    api.body.appendChild(who);

    /* --- deal --- */
    api.body.appendChild(section("Commercials","lane-m",
      el("div",{class:"grid2"},
        field("Campaign month",input(d.month,v=>{d.month=v;},{type:"month"}),{req:true}),
        field("Deliverable",select(d.deliverable,DELIVERABLES,v=>{d.deliverable=v;})),
        field("Locked price (₹)",input(d.price,v=>{d.price=num(v);},{type:"number",min:"0",disabled:d.barter?true:null}),
          {hint:"Excl. GST, as agreed on mail"}),
        el("label",{class:"f"},el("span",{},"Barter"),
          el("div",{style:"display:flex;align-items:center;gap:8px;padding-top:7px"},
            el("input",{type:"checkbox",style:"width:auto",checked:d.barter?true:null,

            el("span",{style:"font-size:13px"},"Product only, no fee"))),
        field("Payment terms",input(d.payTerms,v=>{d.payTerms=v;},{placeholder:"50% advance / 50% post-live"})),
        field("Payment status",select(d.payStatus,PAY_STATES,v=>{d.payStatus=v;build();})),
        field("Payment due date",input(d.payDue,v=>{d.payDue=v;},{type:"date"})),
        field("Amount paid (₹)",input(d.paid,v=>{d.paid=num(v);},{type:"number",min:"0"})),
        field("Paid on",input(d.payDate,v=>{d.payDate=v;},{type:"date"})))));

    /* --- shipment --- */
    const ship=section("What ships, and where","lane-s");
    ship.appendChild(el("div",{class:"grid2"},
      field("Box type",select(d.box,BOXES,v=>{d.box=v;}),{hint:"PR Box goes with the printed sleeve and note card."}),

        if(v==="Dispatched"&&!d.dispatchDate)d.dispatchDate=todayISO();
        if(v==="Delivered"&&!d.deliveryDate)d.deliveryDate=todayISO(); build();}))));
    const items=el("div",{style:"margin:12px 0"});
    items.appendChild(el("div",{style:"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px"},"Products to ship *"));
    const skuList=Object.values(S.skus).filter(s=>s.active!==false);
    (d.items||[]).forEach((it,i)=>{
      const row=el("div",{class:"itemrow"});
      if(skuList.length){
        row.appendChild(select(it.sku,[["","Choose a SKU…"],...skuList.map(s=>[s.code,s.code+" — "+s.name])],v=>{
          const s=skuList.find(x=>x.code===v); it.sku=v; it.name=s?s.name:""; it.mrp=s?s.mrp:0;},{"aria-label":"SKU line "+(i+1)}));
      } else {
        row.appendChild(input(it.sku,v=>{it.sku=v.trim();},{placeholder:"SKU code",  "aria-label":"SKU line "+(i+1)}));
      }
      row.appendChild(input(it.qty,v=>{it.qty=Math.max(1,num(v));},{type:"number",min:"1","aria-label":"Quantity line "+(i+1)}));
      row.appendChild(el("button",{class:"btn btn-q btn-sm","aria-label":"Remove line "+(i+1),
        onclick:()=>{d.items.splice(i,1);build();}},"✕"));
      items.appendChild(row);
    });
    items.appendChild(el("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap"},
      el("button",{class:"btn btn-sm",onclick:()=>{d.items=d.items||[];d.items.push({sku:"",name:"",qty:1,mrp:0});build();}},"+ Add product"),
      !skuList.length?el("span",{class:"hint"},"Tip: load your SKU master under Products so codes can never be mistyped."):null,
      orderValue(d)?el("span",{class:"hint"},"Box value "+inr(orderValue(d))+" at MRP"):null));
    ship.appendChild(items);

    const probs=collabProblems(d), pmap={}; probs.forEach(([k,m])=>{ (pmap[k]=pmap[k]||[]).push(m); });
    const addrField=(label,key,node,opts={})=>{
      const f=field(label,node,opts);
      if(pmap[key]){ node.classList.add("bad"); f.appendChild(el("div",{class:"err"},pmap[key][0])); }
      return f;
    };
    ship.appendChild(el("div",{class:"grid2"},
      addrField("Consignee name","name",input(d.ship.name,v=>{d.ship.name=v;}),{req:true}),
      addrField("Mobile","phone",input(d.ship.phone,v=>{d.ship.phone=v;},{inputmode:"numeric",maxlength:"15",placeholder:"10 digits"}),{req:true}),
      field("Email",input(d.ship.email,v=>{d.ship.email=v;},{type:"email"})),
      addrField("Address line 1","addr1",input(d.ship.addr1,v=>{d.ship.addr1=v;},{placeholder:"Flat / building / street"}),{req:true,span:true}),
      field("Address line 2 / landmark",input(d.ship.addr2,v=>{d.ship.addr2=v;}),{span:true}),
      addrField("Pincode","pin",input(d.ship.pin,v=>{d.ship.pin=digits(v).slice(0,6);},{inputmode:"numeric",maxlength:"6"}),{req:true}),
      addrField("City","city",input(d.ship.city,v=>{d.ship.city=v;}),{req:true}),

    ship.appendChild(el("div",{style:"margin-top:10px"},

          addr1:r.addr1,addr2:r.addr2,city:titleCase(r.city),state:r.state,pin:digits(r.pin)};
        build(); toast("Address split into fields — check it");}})},
        "Paste what the creator sent"),
      el("span",{class:"hint",style:"margin-left:8px"},"Splits a WhatsApp message into these fields")));
    if(d.influencerId) ship.appendChild(el("label",{style:"display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--ink-2)"},
      el("input",{type:"checkbox",style:"width:auto",checked:updateMaster?true:null,onchange:e=>{updateMaster=e.target.checked;}}),
      "Also update this address in the influencer master"));
    ship.appendChild(el("div",{class:"grid2",style:"margin-top:12px"},

      field("Courier",input(d.courier,v=>{d.courier=v;},{placeholder:"Delhivery / Bluedart"})),
      field("AWB / tracking",input(d.awb,v=>{d.awb=v.trim();})),

      field("Dispatched on",input(d.dispatchDate,v=>{d.dispatchDate=v;},{type:"date"})),

    api.foot.appendChild(el("button",{class:"btn",onclick:()=>copyText(briefText({...d,id:d.id||"new"}))},"Copy brief"));

    api.foot.appendChild(el("span",{style:"flex:1"}));
    if(id) api.foot.appendChild(el("button",{class:"btn btn-danger btn-sm",onclick:async()=>{
      if(confirm("Delete this collab permanently?")){ await Store.remove("collabs",id); api.close(); toast("Deleted"); }}},"Delete"));

    if(focus==="metrics"){ setTimeout(()=>{met.scrollIntoView({block:"center"});const f=met.querySelector("input");f&&f.focus();},40); focus=null; }
  };

  async function saveCollab(forceStatus){
    if(!String(d.ship.name||"").trim()){ toast("A consignee name is needed",true); return; }
    if(forceStatus){
      const p=collabProblems(d);
      if(p.length){ toast("Fix "+p.length+" address/product field"+(p.length>1?"s":"")+" before supply can ship it",true); build(); return; }
      d.shipStatus=forceStatus;
    }
    let inf=S.influencers[d.influencerId];
    if(!inf){
      const handle=cleanHandle(d.handle||"");
      const dup=Object.values(S.influencers).find(i=>(handle&&cleanHandle(i.handle)===handle)||
        (phone10(d.ship.phone).length===10&&phone10(i.phone)===phone10(d.ship.phone)));
      if(dup && !confirm(dup.name+" is already in the master with the same handle or mobile.\n\nOK = attach this collab to them.\nCancel = go back and pick manually.")){ return; }
      if(dup){ inf=dup; }
      else {
        inf={id:uid("inf"),name:titleCase(d.ship.name),handle,platform:d.platform,phone:phone10(d.ship.phone),
          email:d.ship.email||"",addr1:d.ship.addr1,addr2:d.ship.addr2,city:d.ship.city,state:d.ship.state,pin:digits(d.ship.pin),
          tier:d.tier||TIERS[1],category:d.category||CATEGORIES[0],notes:"",createdAt:todayISO()};
      }
      await Store.put("influencers",inf); d.influencerId=inf.id;
    } else if(updateMaster){
      await Store.put("influencers",{...inf,name:titleCase(d.ship.name)||inf.name,
        handle:d.handle!==undefined?cleanHandle(d.handle):inf.handle,
        platform:d.platform,tier:d.tier||inf.tier,category:d.category||inf.category,
        phone:phone10(d.ship.phone)||inf.phone,email:d.ship.email||inf.email,
        addr1:d.ship.addr1,addr2:d.ship.addr2,city:d.ship.city,state:d.ship.state,pin:digits(d.ship.pin)});
    }
    delete d.handle; delete d.tier; delete d.category;
    if(id) d.id=id;
    await Store.put("collabs",d);
    api.close();
    toast(forceStatus?"Sent to the ship queue":"Saved");
  }
  build();
}
</script>

/* Reads a Unicommerce item-master export, or any code/name/MRP list.
   Columns are matched by header name so column order does not matter. */
function csvLine(line,sep){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){ const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===sep){ out.push(cur); cur=""; }
    else cur+=ch;
  }
  out.push(cur); return out.map(x=>x.trim());
}
function parseSkuList(txt){
  const lines=String(txt||"").split(/\r?\n/).map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim());
  if(!lines.length) return {rows:[],cols:null};
  const sep=lines[0].includes("\t")?"\t":",";
  const head=csvLine(lines[0],sep).map(h=>h.toLowerCase().replace(/[^a-z0-9]/g,""));
  const find=(...keys)=>{ for(const k of keys){ const i=head.indexOf(k); if(i>=0) return i; }
    for(const k of keys){ const i=head.findIndex(h=>h.includes(k)); if(i>=0) return i; } return -1; };
  const idx={code:find("skucode","sellerskucode","sku","itemcode","code"),
             name:find("itemname","productname","name","description","product"),
             mrp:find("mrp","maximumretailprice","sellingprice","price"),
             hsn:find("hsncode","hsn"),
             ean:find("ean","barcode","upc","gtin")};
  const hasHeader = idx.code>=0 && idx.name>=0;
  const body = hasHeader ? lines.slice(1) : lines;
  const rows=[];
  body.forEach(line=>{
    const p=csvLine(line,sep);
    const code = hasHeader ? p[idx.code] : p[0];
    if(!code) return;
    if(/^(sku|item)\s*code$/i.test(code)) return;
    rows.push({code,
      name: (hasHeader ? p[idx.name] : p[1]) || code,
      mrp:  num(hasHeader ? (idx.mrp>=0?p[idx.mrp]:"") : p[2]),
      hsn:  hasHeader && idx.hsn>=0 ? p[idx.hsn] : "",
      ean:  hasHeader && idx.ean>=0 ? p[idx.ean] : ""});
  });
  return {rows, cols: hasHeader ? csvLine(lines[0],sep) : null};
}

const stateFromPin=p=>{ p=digits(p); if(p.length!==6) return "";

const ADDR_WORDS=new Set(("road,rd,street,st,nagar,colony,sector,block,flat,floor,apartment,apartments,apt,near,opp,opposite,house,plot,lane,gali,marg,chowk,tower,towers,phase,main,cross,layout,post,village,po,ps,building,society,vihar,puram,pura,bagh,park,extension,extn,complex,market,mandi,chowk,gate,circle,residency,enclave,heights,villa,wing,room,shop,store,no,number,behind,beside,front,india,pin,pincode,city,state,mobile,phone,contact,ph,email,name,address,adress,addres,dist,district,tehsil,taluka,landmark").split(","));
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  const m=a.length,n=b.length; let prev=[...Array(n+1).keys()],cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i; let best=i;
    for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); if(cur[j]<best)best=cur[j]; }
    if(best>max) return max+1; const t=prev; prev=cur; cur=t;
  }

}

  if(/uttarpradesh|uttrapradesh/.test(t)) return "Uttar Pradesh";
  if(/orissa/.test(t)) return "Odisha";
  if(/pondicherry/.test(t)) return "Puducherry";
  if(/uttaranchal/.test(t)) return "Uttarakhand";

function findCity(text,pinState){

  city:"city",state:"state",pincode:"pin",pin:"pin",mobile:"phone",phone:"phone",ph:"phone",
  contact:"phone",content:"phone",number:"phone",email:"email",emai:"email"};

  const flags=[]; const text=String(raw||"").replace(/\u00a0/g," ").trim();

  if(!state&&pinState){ state=pinState; flags.push("State guessed from the pincode — confirm it"); }
  if(state&&pinState&&state!==pinState) flags.push("State and pincode disagree: "+pin+" points to "+pinState);
  if(hit&&hit.fuzzy) flags.push("City read as \u201c"+hit.city+"\u201d, written \u201c"+hit.was+"\u201d");

        .replace(/(?:\+?91[\s\-.]?)?\b[6-9]\d{4}[\s\-.]?\d{5}\b/g," ")

      if(!l) continue;

      if(!ws.length||ws.length>4) continue;
      if(ws.some(w=>ADDR_WORDS.has(w.toLowerCase()))) continue;
      if(ws.some(w=>CITY_STATE[w.toLowerCase()]||STATES.some(st=>st.toLowerCase()===w.toLowerCase()))) continue;
      name=titleCase(l); break;
    }

  body=body.replace(/(?:\+?91[\s\-.]?)?\b[6-9]\d{4}[\s\-.]?\d{5}\b/g," ");
  if(pin) body=body.split(pin).join(" ");
  const kill=t=>{ if(!t) return; body=body.replace(new RegExp("\\b"+String(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","ig")," "); };
  kill(name); kill(city); kill(state); if(hit&&hit.was) kill(hit.was);
  if(state==="Uttar Pradesh"){ kill("uttarpradesh"); kill("uttrapradesh"); }
  body=body.replace(STRIP_WORDS," ");

  const segs=[];
  body.split(/[\n,]+/).map(x=>x.replace(/\s+/g," ").trim().replace(/^[-\u2013\u2014:.\s]+|[-\u2013\u2014:.\s]+$/g,""))
    .filter(Boolean).forEach(x=>{
      const k=x.toLowerCase().replace(/[^a-z0-9]/g,"");
      if(!k||k==="india"||k.length<2) return;
      if(segs.some(y=>y.toLowerCase().replace(/[^a-z0-9]/g,"")===k)) return;
      segs.push(x);
    });
  let addr1="",addr2="",spill=false;
  for(const x of segs){
    if(!spill&&(!addr1||(addr1.length+x.length+2)<=42)) addr1=addr1?addr1+", "+x:x;
    else { spill=true; addr2=addr2?addr2+", "+x:x; }
  }
  if(!addr2&&addr1.length>62){
    const m=/^(.{25,}?)\s+(near\s+.+|opp\.?\s+.+|opposite\s+.+|behind\s+.+|beside\s+.+)$/i.exec(addr1);
    if(m){ addr1=m[1].trim(); addr2=titleCase(m[2].trim().slice(0,1))+m[2].trim().slice(1); }
  }
  if(!addr1) flags.push("No street address found");
  if((addr1+addr2).length>120) flags.push("Address is long \u2014 trim it, UC cuts long lines");
  if(digits(phone).length!==10) flags.push("No 10-digit mobile \u2014 the courier will reject it");
  if(digits(pin).length!==6) flags.push("No 6-digit pincode found");
  return {name,phone,email,addr1,addr2,city,state,pin:digits(pin),flags,raw:text};
}
function splitAddressBlobs(text){
  const parts=String(text||"").split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);
  return parts.length?parts:[String(text||"").trim()].filter(Boolean);
}
/* A creator often sends the address, then the phone or email in a second
   message. A block carrying only contact details belongs to the one above it. */
function parseAddressBatch(text){
  const out=[];
  splitAddressBlobs(text).forEach(blob=>{
    const r=parseAddressBlob(blob);
    const contactOnly=!r.addr1&&!r.pin&&!r.name&&!r.city;
    if(contactOnly&&out.length){
      const prev=out[out.length-1];
      if(!prev.phone&&r.phone) prev.phone=r.phone;
      if(!prev.email&&r.email) prev.email=r.email;
      prev.raw=prev.raw+"\n"+r.raw;
      prev.flags=prev.flags.filter(f=>!/10-digit mobile/.test(f));
      if(digits(prev.phone).length!==10) prev.flags.push("No 10-digit mobile \u2014 the courier will reject it");
      return;
    }
    out.push(r);
  });
  return out;
}

  api.body.appendChild(el("div",{class:"callout"},

  api.body.appendChild(field(opts.single?"What the creator sent":"What the creators sent",

    {hint:"Nothing is saved until you press the button at the bottom."}));
  api.body.appendChild(list);
  draw();
}

<script>
/* ================= AI creator screening =================
   The page cannot read Instagram. Every number here is entered by the
   team from the creator's public profile; the arithmetic is done in JS
   and only the judgement is asked of Claude. ======================== */
let Sampler=null;
function sampleErrCopy(code){
  return ({
    not_granted:"You declined the request, so screening is off for this visit. Reload the page to be asked again.",
    sampling_disabled:"AI screening is switched off for this workspace.",
    not_declared:"AI screening is not enabled on this version of the board.",
    session_expired:"Your Claude session expired — reload the page and try again.",
    rate_limited:"Too many screenings at once. Wait a minute and run it again.",
    prompt_too_large:"Too much pasted text. Trim the captions and comments and run it again.",
    invalid_json:"The reply came back malformed. Run it again.",
    refused:"Claude would not answer that. Check the pasted text for anything odd.",
    empty_completion:"An empty reply came back. Run it again.",
    upstream_error:"Claude is unreachable right now. Try again in a minute.",
    cancelled:"Stopped."
  })[code] || "Screening could not finish. Try again in a minute.";
}
const hnum=s=>{
  s=String(s??"").trim().toLowerCase().replace(/,/g,"");
  const m=/^([\d.]+)\s*([klmb]?)/.exec(s); if(!m) return 0;
  const n=parseFloat(m[1]); if(!isFinite(n)) return 0;
  return Math.round(n*({k:1e3,l:1e5,m:1e6,b:1e9}[m[2]]||1));
};
function parsePosts(txt){
  return String(txt||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    if(/likes?/i.test(line)&&/comments?/i.test(line)&&!/\d/.test(line)) return null;
    const p=line.split(/[,\t;|]+|\s{2,}|\s+/).filter(Boolean);
    if(!p.length||!/\d/.test(p[0])) return null;
    return {likes:hnum(p[0]),comments:hnum(p[1]),views:hnum(p[2])};
  }).filter(Boolean);
}
function screenMath(f){
  const posts=parsePosts(f.postsRaw), n=posts.length;
  const avg=k=>n?posts.reduce((s,p)=>s+num(p[k]),0)/n:0;
  const aL=avg("likes"), aC=avg("comments"), aV=avg("views");
  const fol=num(f.followers);
  const vs=posts.map(p=>num(p.views)).filter(v=>v>0);
  const mean=vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:0;
  const sd=vs.length>1?Math.sqrt(vs.reduce((s,v)=>s+(v-mean)**2,0)/(vs.length-1)):0;
  return {posts,n,avgLikes:aL,avgComments:aC,avgViews:aV,
    erFollowers:fol?((aL+aC)/fol*100):0,
    erViews:aV?((aL+aC)/aV*100):0,
    commentRatio:aL?(aC/aL*100):0,
    viewMultiple:fol?(aV/fol):0,
    viewCV:mean?(sd/mean*100):0,
    projCPV:(aV&&num(f.quote))?num(f.quote)/aV:0,
    projCPM:(aV&&num(f.quote))?num(f.quote)/aV*1000:0};
}

  } else {
    wrap.appendChild(el("div",{class:"panel"},emptyState("Nothing screened yet",
      "Open a creator, paste their follower count and the last few reels, and the read is saved here.",

  if(rest.length){

    rest.slice(0,40).forEach(i=>chips.appendChild(
      el("button",{class:"pchip",onclick:()=>openScreen(i.id)},i.name||"Unnamed")));
    wrap.appendChild(el("div",{style:"margin-top:16px"},el("div",{class:"panel"},
      el("div",{class:"panel-h"},el("div",{},el("h3",{},"Not screened yet"),
        el("div",{class:"sub"},rest.length+" in the master \u2014 click one to screen it"))),
      el("div",{class:"panel-b"},chips))));
  }
  return wrap;
}

function openScreen(infId){

        ["Projected CPV",m.projCPV?"₹"+m.projCPV.toFixed(2):"—","at their quoted price"],
        ["Projected CPM",m.projCPM?"₹"+Math.round(m.projCPM):"—","per 1000 views"]
      ];
      const tb=el("tbody",{});

    if(result) drawResult(result);

    if(Sampler){
      const runBtn=el("button",{class:"btn btn-p",disabled:busy?true:null,onclick:run},busy?"Screening…":(result?"Screen again":"Screen this creator"));
      api.foot.appendChild(runBtn);
      if(busy) api.foot.appendChild(el("button",{class:"btn",onclick:()=>{ctl&&ctl.abort();}},"Stop"));
    }
    if(result&&infId) api.foot.appendChild(el("button",{class:"btn",onclick:async()=>{
      await Store.put("influencers",{...S.influencers[infId],followers:num(f.followers),screen:result});
      toast("Screening saved to the influencer record");}},"Save to influencer"));
    if(result&&Sampler) api.foot.appendChild(el("button",{class:"btn btn-s",disabled:busy?true:null,onclick:draftMail},"Draft outreach mail"));
    api.foot.appendChild(el("span",{style:"flex:1"}));
    api.foot.appendChild(el("button",{class:"btn btn-q btn-sm",onclick:api.close},"Close"));
  };

  function promptFor(m){
    return [
"You are screening a creator for a paid reel + product-gifting collab for Aravi Organic,",
"an Indian D2C beauty and personal-care brand (skincare, haircare, body care; MRPs roughly",
"₹300–₹1300; sold on Amazon, Flipkart, Myntra, Nykaa, Meesho and its own Shopify store).",
"",
"Every number below was typed in by the marketing team from the creator's public profile,",
"and the ratios were computed arithmetically — treat them as given. You cannot browse.",
"Where the evidence is thin, lower your confidence rather than inventing detail. Never",
"state a follower demographic, a past brand deal or an audience location that is not",
"visible in the pasted text.",
"",
"CREATOR",
"handle: @"+(f.handle||"unknown"),
"platform: "+f.platform+"   tier: "+f.tier+"   category: "+f.category,
"location: "+(f.city||"not given"),
"followers: "+(num(f.followers)||"not given"),
"their quoted price: "+(num(f.quote)?("₹"+num(f.quote)):"not quoted yet"),
"",
"COMPUTED FROM "+m.n+" RECENT POSTS",
"avg likes: "+Math.round(m.avgLikes)+"   avg comments: "+Math.round(m.avgComments)+"   avg views: "+Math.round(m.avgViews),
"engagement rate on followers: "+m.erFollowers.toFixed(2)+"%",
"engagement rate on views: "+(m.erViews?m.erViews.toFixed(2)+"%":"not available"),
"comments per 100 likes: "+m.commentRatio.toFixed(1),
"views per follower: "+(m.viewMultiple?m.viewMultiple.toFixed(2):"not available"),
"view spread across the sampled reels: "+(m.viewCV?("±"+m.viewCV.toFixed(0)+"%"):"not available"),
"projected cost per view at their quote: "+(m.projCPV?("₹"+m.projCPV.toFixed(2)):"not available"),
"",
"BIO AND CAPTIONS",
(f.bio||"(none pasted)").slice(0,3000),
"",
"TOP COMMENTS",
(f.comments||"(none pasted)").slice(0,3000),
"",
"Judge fit, whether the engagement looks earned, and what this is worth to a beauty brand",
"buying reach in India. Price in rupees against the projected views, not against follower",
"count. Reply with only this JSON object:",
'{"verdict":"Go"|"Negotiate"|"Hold"|"Pass","confidence":"high"|"medium"|"low","fitScore":0-100,',
'"headline":"one sentence a founder can act on","fairPriceLow":number,"fairPriceHigh":number,',
'"priceRationale":"one sentence naming the ₹ per 1000 views you used",',
'"authenticity":"is the engagement earned, and what in the data says so",',
'"audienceRead":"who appears to be watching, from the captions and comments",',
'"brandCollabs":["brand or product category visible in the pasted captions"],',
'"strengths":["..."],"risks":["..."],"askBeforeLocking":["question to put to the creator"],',
'"suggestedDeliverable":"...","suggestedProducts":["Aravi product type that suits this audience"]}',
"Every string under 200 characters. Use [] where the pasted text shows nothing."
    ].join("\n");
  }
  async function run(){
    const m=screenMath(f);
    if(!num(f.followers)){ toast("Follower count is needed for the maths",true); return; }
    if(m.n<3){ toast("Paste at least three recent posts",true); return; }
    busy=true; mail=""; build();
    out.innerHTML=""; out.appendChild(el("div",{class:"callout"},"Thinking… a full read takes up to a minute."));
    ctl=new AbortController();
    try{
      const r=await Sampler.json(promptFor(m),{signal:ctl.signal,modelTier:"default"});
      result={...r,at:new Date().toISOString(),
        er:+m.erFollowers.toFixed(2),erViews:+m.erViews.toFixed(2),avgViews:Math.round(m.avgViews),
        sampled:m.n,quoted:num(f.quote)};
      busy=false; build();
    }catch(e){
      busy=false; build();
      out.innerHTML=""; out.appendChild(el("div",{class:"callout crit"},sampleErrCopy(e&&e.code)));
    }
  }
  async function draftMail(){
    busy=true; build();
    const box=el("div",{class:"panel",style:"margin-top:14px"},
      el("div",{class:"panel-h"},el("h3",{},"Outreach mail")),
      el("div",{class:"panel-b"},el("div",{class:"hint"},"Thinking…")));
    out.appendChild(box);
    const body=box.querySelector(".panel-b");
    ctl=new AbortController();
    const p=["Write the first outreach email from Aravi Organic (Hivefy Lifestyle Pvt Ltd), an Indian D2C beauty brand,",
      "to the creator @"+(f.handle||"")+" ("+f.tier+", "+f.category+", "+(f.city||"India")+").",
      "Offer: "+(result.suggestedDeliverable||"one Instagram reel")+", products shipped free, fee of ₹"+
        (result.fairPriceLow||"")+"–₹"+(result.fairPriceHigh||"")+" negotiable.",
      "Indian business English, warm but brief, no exclamation marks, no emoji, no hype adjectives.",
      "Structure: subject line, two short paragraphs, then a compact numbered list of terms covering",
      "deliverable and format, usage rights for paid ads (90 days), posting window, revision policy,",
      "payment terms and timeline, disclosure requirement (#ad / paid partnership tag), and a line asking",
      "them to reply 'confirmed' on this thread so the terms are on record. End asking for their",
      "shipping address, pincode and mobile number. Under 300 words. Plain text only."].join("\n");
    try{
      await Sampler(p,{signal:ctl.signal,onText:({text})=>{
        body.innerHTML="";
        body.appendChild(el("pre",{style:"white-space:pre-wrap;font-family:var(--sans);font-size:13px;margin:0"},text));
      }});
      mail=body.textContent;
      body.appendChild(el("div",{style:"margin-top:12px"},
        el("button",{class:"btn btn-sm",onclick:()=>copyText(mail)},"Copy mail")));
    }catch(e){
      body.innerHTML=""; body.appendChild(el("div",{class:"hint",style:"color:var(--crit)"},sampleErrCopy(e&&e.code)));
    }
    busy=false; build();
  }
  function drawResult(r){
    const tone={Go:"good",Negotiate:"warn",Hold:"warn",Pass:"crit"}[r.verdict]||"neutral";
    const box=el("div",{class:"panel",style:"margin-bottom:14px"});
    box.appendChild(el("div",{class:"panel-h"},
      el("h3",{},"Claude's read"),
      el("div",{style:"margin-left:auto;display:flex;gap:8px;align-items:center"},
        pill(r.verdict||"—",tone),
        el("span",{class:"tag"},(r.confidence||"")+" confidence"))));
    const b=el("div",{class:"panel-b"});
    if(r.headline) b.appendChild(el("p",{style:"margin:0 0 14px;font-size:15px;font-weight:600;line-height:1.45"},r.headline));
    const fit=Math.max(0,Math.min(100,num(r.fitScore)));
    b.appendChild(el("div",{style:"margin-bottom:14px"},
      el("div",{style:"display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px"},
        el("span",{},"Fit with the Aravi range"),el("span",{class:"mono"},fit+"/100")),
      el("div",{style:"height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden"},
        el("div",{style:"height:100%;border-radius:4px;width:"+fit+"%;background:var(--"+(fit>=70?"good":fit>=45?"warn":"crit")+")"}))));
    if(num(r.fairPriceLow)||num(r.fairPriceHigh)){
      const q=num(r.quoted);
      b.appendChild(el("div",{class:"callout"+(q&&q>num(r.fairPriceHigh)?" warn":"")},
        el("b",{},"Worth ₹"+Math.round(num(r.fairPriceLow)).toLocaleString("en-IN")+"–₹"+Math.round(num(r.fairPriceHigh)).toLocaleString("en-IN")),
        q?(" · they quoted "+inr(q)+(q>num(r.fairPriceHigh)?" — above the band":q<num(r.fairPriceLow)?" — below the band":" — inside the band")):"",
        r.priceRationale?el("div",{style:"margin-top:5px"},r.priceRationale):null));
    }
    const listBlock=(title,items,color)=>{
      if(!Array.isArray(items)||!items.length) return null;
      return el("div",{},el("div",{style:"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:"+(color||"var(--ink-3)")+";margin-bottom:6px"},title),
        el("ul",{style:"margin:0 0 14px 18px;padding:0;font-size:13px;line-height:1.6"},...items.slice(0,6).map(x=>el("li",{},String(x)))));
    };
    if(r.authenticity) b.appendChild(el("div",{style:"margin-bottom:14px"},
      el("div",{style:"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px"},"Is the engagement earned"),
      el("div",{style:"font-size:13px"},r.authenticity)));
    if(r.audienceRead) b.appendChild(el("div",{style:"margin-bottom:14px"},
      el("div",{style:"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px"},"Who is watching"),
      el("div",{style:"font-size:13px"},r.audienceRead)));
    b.appendChild(el("div",{class:"grid2"},
      listBlock("Strengths",r.strengths,"var(--good)")||el("div",{}),
      listBlock("Risks",r.risks,"var(--crit)")||el("div",{})));
    if(Array.isArray(r.brandCollabs)&&r.brandCollabs.length)
      b.appendChild(el("div",{style:"margin-bottom:14px"},
        el("div",{style:"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px"},"Brand collabs visible in the captions"),
        el("div",{},...r.brandCollabs.slice(0,8).map(x=>el("span",{class:"tag",style:"margin:0 6px 6px 0"},String(x))))));
    b.appendChild(listBlock("Ask before you lock",r.askBeforeLocking)||el("div",{}));
    if(r.suggestedDeliverable||(Array.isArray(r.suggestedProducts)&&r.suggestedProducts.length))
      b.appendChild(el("div",{class:"callout"},
        r.suggestedDeliverable?el("div",{},el("b",{},"Suggested deliverable: "),r.suggestedDeliverable):null,
        (Array.isArray(r.suggestedProducts)&&r.suggestedProducts.length)
          ? el("div",{style:"margin-top:4px"},el("b",{},"Send: "),r.suggestedProducts.join(", ")):null));
    b.appendChild(el("div",{class:"hint",style:"margin-top:12px"},
      "A judgement from the numbers and text your team pasted on "+dmy(r.at)+", not a measurement of the account. Verify anything that changes the price."));
    box.appendChild(b);
    out.innerHTML=""; out.appendChild(box);
  }
  build();
}
</script>

<script>
/* ================= bulk build + paste back ================= */
function openBulkBuild(){
  const chosen = UI.sel.size
    ? [...UI.sel].map(id=>S.collabs[id]).filter(Boolean)
    : collabList().filter(c=>c.shipStatus==="Ready to Ship");
  const clean = chosen.filter(c=>!collabProblems(c).length);
  const blocked = chosen.filter(c=>collabProblems(c).length);
  const api=drawer("Unicommerce bulk file","One row per item · "+(S.settings.ucColumns||[]).length+" columns",()=>{});

  if(!clean.length){
    api.body.appendChild(el("div",{class:"callout crit"},el("b",{},"Nothing is ready to upload. "),
      chosen.length?"Every selected row still has an address or SKU problem.":"Move rows to “Ready to ship” first."));
    blocked.forEach(c=>api.body.appendChild(el("div",{class:"panel",style:"margin-bottom:8px"},
      el("div",{class:"panel-b"},el("b",{},(c.ship||{}).name||"—"),
        el("ul",{style:"margin:6px 0 0 18px;color:var(--crit);font-size:12.5px"},
          ...collabProblems(c).map(p=>el("li",{},p[1])))))));
    api.foot.appendChild(el("button",{class:"btn",onclick:api.close},"Close"));
    return;
  }

  if(!String(S.settings.shipMethod||"").trim()){
    api.body.appendChild(el("div",{class:"callout crit"},el("b",{},"Shipping Method is blank. "),
      "UC rejects the file without it. Set it once under Setup \u2014 it is one of the five mandatory columns."));
    api.foot.appendChild(el("button",{class:"btn btn-p",onclick:()=>{api.close();go("setup");}},"Open Setup"));
    api.foot.appendChild(el("button",{class:"btn",onclick:api.close},"Close"));
    return;
  }
  const {csv,assigned}=buildUCFile(clean);
  const lines = clean.reduce((s,c)=>s+(c.items||[]).length,0);
  api.body.appendChild(el("div",{class:"callout"},
    el("b",{},clean.length+" orders · "+lines+" item rows across "+(S.settings.ucColumns||[]).length+" columns. "),
    "All five mandatory columns are filled: sales order code, COD (0, prepaid), sale order item code, shipping method (",
    el("b",{},S.settings.shipMethod),") and item SKU code. Upload it in Unicommerce → Orders → Import. The order codes below are written back here, so the tracking you paste later matches."));
  if(blocked.length) api.body.appendChild(el("div",{class:"callout crit"},
    el("b",{},blocked.length+" row"+(blocked.length>1?"s":"")+" left out — "),"address or SKU incomplete. Fix them and build again."));

  const tb=el("tbody",{});
  assigned.forEach(({collab:c,code,reused})=>{
    tb.appendChild(el("tr",{},
      el("td",{class:"mono"},code,reused?el("span",{class:"tag",style:"margin-left:6px"},"existing"):null),
      el("td",{},(c.ship||{}).name,el("div",{class:"t-sub mono"},(c.ship||{}).city+" · "+digits((c.ship||{}).pin))),
      el("td",{class:"mono"},(c.items||[]).map(i=>i.sku+"×"+i.qty).join(", ")),
      el("td",{},el("span",{class:"tag "+(c.box==="PR Box"?"pr":"")},c.box))));
  });
  api.body.appendChild(el("div",{class:"panel",style:"margin-bottom:14px"},el("div",{class:"tw"},el("table",{},
    el("thead",{},el("tr",{},el("th",{},"Order code"),el("th",{},"Ship to"),el("th",{},"Items"),el("th",{},"Box"))),tb))));

  api.body.appendChild(field("File preview",el("textarea",{rows:8,readonly:true,"aria-label":"CSV preview"},
    csv.replace(/^﻿/,"").split("\r\n").slice(0,6).join("\n")+(lines>5?"\n… "+lines+" item rows in total":"")),
    {hint:"Saved as UTF-8 with a byte-order mark and CRLF line endings, which is what Excel and UC both expect."}));

  const applyCodes=async()=>{
    for(const {collab:c,code} of assigned)
      await Store.put("collabs",{...S.collabs[c.id],ucCode:code,shipStatus:"Order Created"});
    UI.sel.clear();
  };
  api.foot.appendChild(el("button",{class:"btn btn-s",onclick:async()=>{
    const ok=await saveFile("uc-bulk-orders-"+todayISO()+".csv",csv);
    if(ok){ await applyCodes(); api.close(); toast(clean.length+" orders moved to “Order created”"); }
  }},"Download & mark as created in UC"));
  api.foot.appendChild(el("button",{class:"btn",onclick:()=>copyText(csv.replace(/^﻿/,""))},"Copy file text"));
  api.foot.appendChild(el("span",{style:"flex:1"}));
  api.foot.appendChild(el("button",{class:"btn btn-q btn-sm",onclick:api.close},"Cancel"));
}

function openPasteBack(){
  let txt="", parsed=[];
  const api=drawer("Paste dispatch details back",
    "Export dispatched orders from UC, paste the rows — order code, AWB, courier, date.",()=>{});
  const preview=el("div",{});
  const parse=()=>{
    parsed=[];
    txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
      const sep=line.includes("\t")?"\t":",";
      const p=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,""));
      if(!p[0]||/sale\s*order|order\s*code/i.test(p[0])) return;
      const key=p[0].toLowerCase();
      const c=collabList().find(x=>(x.ucCode||"").toLowerCase()===key)
           || collabList().find(x=>(x.awb||"").toLowerCase()===key);
      const dateRaw=p.find(x=>/^\d{2}[\/\-]\d{2}[\/\-]\d{2,4}/.test(x)||/^\d{4}-\d{2}-\d{2}/.test(x));
      parsed.push({code:p[0],awb:p[1]||"",courier:p[2]||"",date:normDate(dateRaw),collab:c||null});
    });
    preview.innerHTML="";
    if(!parsed.length){ preview.appendChild(el("div",{class:"hint"},"Nothing parsed yet.")); return; }
    const hit=parsed.filter(r=>r.collab).length;
    preview.appendChild(el("div",{class:"callout"+(hit?"":" crit")},
      el("b",{},hit+" of "+parsed.length+" rows matched. "),
      hit<parsed.length?"Unmatched rows are ignored — check the order code column is first.":"Applying will mark them Dispatched."));
    const tb=el("tbody",{});
    parsed.forEach(r=>tb.appendChild(el("tr",{},
      el("td",{class:"mono"},r.code),
      el("td",{},r.collab?((r.collab.ship||{}).name):pill("no match","crit")),
      el("td",{class:"mono"},r.awb||"—"),
      el("td",{},r.courier||"—"),
      el("td",{class:"mono"},r.date?dmy(r.date):"—"))));
    preview.appendChild(el("div",{class:"panel"},el("div",{class:"tw"},el("table",{},
      el("thead",{},el("tr",{},el("th",{},"Order code"),el("th",{},"Matched to"),el("th",{},"AWB"),
        el("th",{},"Courier"),el("th",{},"Dispatched"))),tb))));
  };
  api.body.appendChild(el("div",{class:"callout"},"Column order expected: ",
    el("b",{},"sale order code · AWB · courier · dispatch date"),". Extra columns are ignored, so a raw UC export usually pastes straight in."));
  api.body.appendChild(field("Dispatch rows",el("textarea",{rows:9,
    placeholder:"PR-2602-004\t1489328891140\tDelhivery\t14/02/2026",
    oninput:e=>{txt=e.target.value;parse();}})));
  api.body.appendChild(preview); parse();
  api.foot.appendChild(el("button",{class:"btn btn-s",onclick:async()=>{
    const rows=parsed.filter(r=>r.collab);
    if(!rows.length){toast("No rows matched an order code",true);return;}
    for(const r of rows){
      const c=S.collabs[r.collab.id]; if(!c) continue;
      await Store.put("collabs",{...c,awb:r.awb||c.awb,courier:r.courier||c.courier,
        dispatchDate:r.date||c.dispatchDate||todayISO(),
        shipStatus:c.shipStatus==="Delivered"?"Delivered":"Dispatched"});
    }
    api.close(); toast(rows.length+" shipments updated");
  }},"Apply to "+"matched rows"));
  api.foot.appendChild(el("button",{class:"btn",onclick:api.close},"Cancel"));
}
function normDate(s){
  if(!s) return "";
  s=String(s).trim();
  let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(m) return m[0];
  m=/^(\d{2})[\/\-](\d{2})[\/\-](\d{2,4})/.exec(s);
  if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return y+"-"+m[2]+"-"+m[1]; }
  return "";
}

/* ================= boot ================= */
(async function boot(){
  $("#view").appendChild(el("div",{class:"empty"},el("h4",{},"Loading the board…"),
    el("p",{},"Fetching collabs, influencers and your Unicommerce settings.")));
  await Store.init();
  if(window.claude && claude.use)
    claude.use("sample").then(f=>{ Sampler=f; if(Store.ready) render(); }).catch(()=>{});
  if(!Object.keys(S.collabs).length && !Object.keys(S.influencers).length){
    await loadSamples();
  }
  render();
})();
</script>
