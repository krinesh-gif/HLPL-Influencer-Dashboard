name: Build Aravi Windows Outreach
on:
  push:
    branches: [codex/windows-instagram-outreach]
    paths: ['desktop-outreach/**', '.github/workflows/aravi-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop-outreach
        shell: pwsh
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Package application
        run: python -m PyInstaller --clean --noconfirm AraviOutreach.spec
      - name: Verify packaged application and browser
        run: |
          $process = Start-Process -FilePath '.\dist\AraviOutreach\AraviOutreach.exe' -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Packaged smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
          Copy-Item WINDOWS_README.txt dist\AraviOutreach\READ_ME_FIRST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AraviOutreach-Windows
          path: desktop-outreach/dist/AraviOutreach/
          retention-days: 30
