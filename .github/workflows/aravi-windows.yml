name: Build Aravi Windows Outreach
on:
  push:
    branches: [codex/windows-instagram-outreach]
    paths: ['desktop-outreach/**', '.github/workflows/aravi-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop-outreach
        shell: pwsh
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Package application
        run: python -m PyInstaller --clean --noconfirm AraviOutreach.spec
      - name: Verify packaged application and browser
        run: |
          $headed = Get-ChildItem 'dist\AraviOutreach\_internal\playwright\driver\package\.local-browsers\chromium-*\chrome-win64\chrome.exe'
          if (-not $headed) { throw 'Headed Chromium is missing from the package' }
          Copy-Item WINDOWS_README.txt dist\AraviOutreach\READ_ME_FIRST.txt
          Compress-Archive -Path dist\AraviOutreach\* -DestinationPath dist\AraviOutreach-Windows.zip
          $relocated = Join-Path $env:RUNNER_TEMP 'Aravi extracted test'
          Expand-Archive dist\AraviOutreach-Windows.zip $relocated
          $process = Start-Process -FilePath (Join-Path $relocated 'AraviOutreach.exe') -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Packaged smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: AraviOutreach-Windows
          path: desktop-outreach/dist/AraviOutreach/
          retention-days: 30
          include-hidden-files: true
      - name: Download the exact uploaded application
        uses: actions/download-artifact@v4
        with:
          name: AraviOutreach-Windows
          path: ${{ runner.temp }}/Aravi downloaded artifact
      - name: Verify downloaded application and full browser
        run: |
          $downloaded = Join-Path $env:RUNNER_TEMP 'Aravi downloaded artifact'
          python verify_artifact.py dist\AraviOutreach "$downloaded"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $process = Start-Process -FilePath (Join-Path $downloaded 'AraviOutreach.exe') -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Downloaded application timed out' }
          if ($process.ExitCode -ne 0) { throw "Downloaded application failed: $($process.ExitCode)" }
